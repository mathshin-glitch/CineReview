<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Cadastro de Filme</title>
        <meta charset="UTF-8">

        <!-- Configuração para a página funcionar corretamente em dispositivos menores -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

        <!-- JavaScript da página -->
        <script th:src="@{/js/cadastro.js}"></script>
    </head>

    <body>

        <!-- Container principal da página -->
        <div class="container mt-4 mb-5">

            <h1 class="mb-2">Cadastro de Filme</h1>

            <p class="text-muted mb-4">
                Preencha os dados abaixo para cadastrar um filme.
            </p>

            <!-- Formulário de cadastro -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <form id="formCadastro">

                        <!-- Campo do título -->
                        <div class="mb-3">
                            <label for="titulo" class="form-label">
                                Título
                            </label>

                            <input type="text"
                                   id="titulo"
                                   class="form-control"
                                   placeholder="Digite o título do filme">
                        </div>

                        <!-- Campo do gênero -->
                        <div class="mb-3">
                            <label for="genero" class="form-label">
                                Gênero
                            </label>

                            <input type="text"
                                   id="genero"
                                   class="form-control"
                                   placeholder="Digite o gênero do filme">
                        </div>

                        <!-- Campo do ano de lançamento -->
                        <div class="mb-3">
                            <label for="lancamento" class="form-label">
                                Ano de lançamento
                            </label>

                            <input type="number"
                                   id="lancamento"
                                   class="form-control"
                                   placeholder="Digite o ano de lançamento">
                        </div>

                        <!-- Campo da sinopse -->
                        <div class="mb-3">
                            <label for="sinopse" class="form-label">
                                Sinopse
                            </label>

                            <textarea id="sinopse"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Digite a sinopse do filme"></textarea>
                        </div>

                        <!-- Botão de enviar -->
                        <button type="submit"
                                class="btn btn-primary">
                            Salvar filme
                        </button>

                    </form>

                </div>
            </div>

        </div>

    </body>

</html>
