<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Filmes Cadastrados</title>
        <meta charset="UTF-8">

        <!-- Configuração para a página funcionar corretamente em dispositivos menores -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

        <!-- JavaScript da página -->
        <script th:src="@{/js/resultado.js}"></script>
    </head>

    <body>

        <!-- Container principal da página -->
        <div class="container mt-4 mb-5">

            <h1 class="mb-2">Filmes Cadastrados</h1>

            <p class="text-muted mb-4">
                Confira todos os filmes cadastrados no sistema.
            </p>

            <!-- Tabela onde os filmes serão exibidos -->
            <div class="card shadow-sm border-0">
                <div class="card-body">

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">

                            <thead class="table-dark">
                                <tr>
                                    <th>Título</th>
                                    <th>Gênero</th>
                                    <th>Lançamento</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>

                            <tbody id="tabelaFilmes">
                                <!-- JavaScript vai colocar os filmes aqui -->
                            </tbody>

                        </table>
                    </div>

                </div>
            </div>

        </div>

    </body>

</html>
