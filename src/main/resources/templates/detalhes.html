<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Detalhes do Filme</title>
        <meta charset="UTF-8">

        <!-- Configuração para a página funcionar corretamente em dispositivos menores -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

        <!-- JavaScript da página de detalhes -->
        <script th:src="@{/js/detalhes.js}"></script>
    </head>

    <body>

        <!-- Container principal da página -->
        <div class="container mt-4 mb-5">

            <h1 class="mb-4">Detalhes do Filme</h1>

            <!-- Mostra os dados do filme selecionado -->
            <div id="detalhesFilme" class="card shadow-sm border-0 p-4 mb-4">
                <!-- JavaScript vai colocar os dados aqui -->
            </div>

            <!-- Formulário para adicionar ou editar uma análise -->
            <div class="card shadow-sm border-0 p-4 mb-4">

                <h2 id="tituloFormulario" class="mb-2">
                    Sua avaliação
                </h2>

                <p class="text-muted">
                    Compartilhe sua opinião sobre este filme.
                </p>

                <form id="formAnalise">

                    <!-- Campo onde o usuário escreve a análise -->
                    <div class="mb-3">
                        <label for="analise" class="form-label">
                            Análise
                        </label>

                        <textarea id="analise"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Digite sua análise sobre o filme"></textarea>
                    </div>

                    <!-- Campo para informar a nota -->
                    <div class="mb-3">
                        <label for="nota" class="form-label">
                            Nota
                        </label>

                        <input type="number"
                               id="nota"
                               class="form-control"
                               min="0"
                               max="5"
                               step="0.5"
                               placeholder="Digite uma nota de 0 a 5">
                    </div>

                    <button type="submit"
                            id="btnEnviarAnalise"
                            class="btn btn-primary">
                        Enviar avaliação
                    </button>

                </form>
            </div>

            <!-- Mostra as análises cadastradas para o filme -->
            <div>

                <h2 class="mb-2">Análises dos usuários</h2>

                <p class="text-muted mb-4">
                    Confira as avaliações e opiniões sobre este filme.
                </p>

                <div id="listaAnalises">
                    <!-- JavaScript vai colocar as análises aqui -->
                </div>

            </div>

        </div>

    </body>

</html>
